server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biopet_db}   # URL de conexion
    username: ${DB_USER:biopet_user}                            # usuario de PostgreSQL
    password: ${DB_PASSWORD:biopet_pass}                        # contrasena
    driver-class-name: org.postgresql.Driver                    # driver oficial de PostgreSQL (JDBC)

  # JPA / HIBERNATE (ORM)
  jpa:
    hibernate:
      ddl-auto: validate    # Hibernate NO crea/modifica tablas: solo valida contra el esquema de Flyway
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  # FLYWAY (migraciones de base de datos)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

security:
  jwt:
    secret: ${JWT_SECRET:9c8f9a7d6e5b4c3a2d1f0e9c8b7a6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4321,http://127.0.0.1:4321}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
