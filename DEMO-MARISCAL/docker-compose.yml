# ==================================================
# DEMO-MARISCAL - Docker Compose
# ==================================================
# Levanta unicamente lo necesario para la demostracion:
#   - PostgreSQL (base de datos real)
#   - Redis (cache de /api/mascotas y lista negra de tokens JWT)
#   - Backend Spring Boot (API REST)
#
# El cliente Astro NO se incluye aqui: se ejecuta aparte con
# "npm run dev" (ver astro-cliente/ y GUIA-EXPOSICION.md).

services:
  postgres:
    image: postgres:16-alpine
    container_name: biopet-demo-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-biopet_db}
      POSTGRES_USER: ${DB_USER:-biopet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-biopet_pass}
    ports:
      - "5433:5432"
    volumes:
      - biopet_demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-biopet_user} -d ${DB_NAME:-biopet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: biopet-demo-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: biopet-demo-backend
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

volumes:
  biopet_demo_postgres_data:
